<!-- Institutional Multi-Timeframe Strategy & Execution Engine -->
<script>
/**
 * 1. INSTITUTIONAL STRATEGY & RISK ENGINE
 */
class InstitutionalStrategyEngine {
  constructor(accountBalance = 20000, maxRiskPercent = 0.01, spreadBufferPips = 2) {
    this.accountBalance = accountBalance;
    this.maxRiskPercent = maxRiskPercent; // 1% risk cap per trade
    this.spreadBufferPips = spreadBufferPips;
  }

  evaluateMultiTimeframe(timeframeData, currentTimestamp = new Date()) {
    // Session Filter (London / NY Active Hours)
    if (!this.isHighLiquiditySession(currentTimestamp)) {
      return { status: "REJECTED", reason: "Outside active session window (London/NY)." };
    }

    const { HTF, ITF, LTF } = timeframeData;
    if (!HTF || !ITF || !LTF || HTF.length < 20 || ITF.length < 10 || LTF.length < 5) {
      return { status: "REJECTED", reason: "Insufficient multi-timeframe candle data." };
    }

    // Step 1: HTF Liquidity Sweep
    const htfSweep = this.detectLiquiditySweep(HTF);
    if (!htfSweep.occurred) {
      return { status: "REJECTED", reason: "No HTF Liquidity Sweep detected." };
    }

    // Step 2: ITF Market Structure Shift (CHoCH)
    const itfChoch = this.detectCHoCH(ITF, htfSweep.direction);
    if (!itfChoch.confirmed) {
      return { status: "WAITING", reason: "Pending ITF structural CHoCH confirmation." };
    }

    // Step 3: 50% Order Block & FVG Validation
    const orderBlock = this.calculateOrderBlock50(ITF, itfChoch.displacementIndex, htfSweep.direction);
    if (!orderBlock.hasFVG) {
      return { status: "REJECTED", reason: "Displacement move lacks Fair Value Gap (FVG)." };
    }

    // Step 4: LTF Retest & Confirmation Entry
    const ltfConfirmation = this.checkLTFConfirmation(LTF, orderBlock.level50, htfSweep.direction);
    if (!ltfConfirmation.entryTriggered) {
      return { status: "MONITORING", reason: "Monitoring: Price retest of 50% OB pending." };
    }

    // Step 5: Dynamic Position Sizing & Risk Filtering
    const tradeParams = this.calculateRiskParameters({
      direction: htfSweep.direction,
      entryPrice: ltfConfirmation.price,
      sweepInvalidationPrice: htfSweep.invalidationPrice,
      opposingLiquidityPrice: htfSweep.opposingLiquidityPrice
    });

    if (tradeParams.riskRewardRatio < 2.0) {
      return { status: "REJECTED", reason: `R:R too low (${tradeParams.riskRewardRatio}:1). Min 2.0:1 required.` };
    }

    return {
      status: "EXECUTE_TRADE",
      timestamp: currentTimestamp.toISOString(),
      direction: htfSweep.direction,
      entryPrice: tradeParams.entryPrice,
      stopLoss: tradeParams.stopLoss,
      tp1: tradeParams.tp1,
      tp2: tradeParams.tp2,
      positionSizeLots: tradeParams.positionSizeLots,
      riskAmountUSD: tradeParams.riskAmountUSD,
      riskRewardRatio: tradeParams.riskRewardRatio
    };
  }

  isHighLiquiditySession(date) {
    const utcHour = date.getUTCHours();
    return utcHour >= 7 && utcHour < 21; // 07:00 to 21:00 UTC
  }

  detectLiquiditySweep(candles) {
    const recent = candles[candles.length - 1];
    const lookback = candles.slice(-21, -1);
    const swingHigh = Math.max(...lookback.map(c => c.high));
    const swingLow = Math.min(...lookback.map(c => c.low));

    if (recent.high > swingHigh && recent.close < swingHigh) {
      return { occurred: true, direction: "BEARISH", invalidationPrice: recent.high, opposingLiquidityPrice: swingLow };
    }
    if (recent.low < swingLow && recent.close > swingLow) {
      return { occurred: true, direction: "BULLISH", invalidationPrice: recent.low, opposingLiquidityPrice: swingHigh };
    }
    return { occurred: false };
  }

  detectCHoCH(candles, direction) {
    const current = candles[candles.length - 1];
    const refIdx = candles.length - 2;
    if (direction === "BULLISH" && current.close > candles[refIdx].high) return { confirmed: true, displacementIndex: refIdx };
    if (direction === "BEARISH" && current.close < candles[refIdx].low) return { confirmed: true, displacementIndex: refIdx };
    return { confirmed: false };
  }

  calculateOrderBlock50(candles, idx, direction) {
    const candle1 = candles[idx - 1];
    const candle3 = candles[idx + 1];
    if (!candle1 || !candle3) return { hasFVG: false };

    let hasFVG = direction === "BULLISH" ? (candle3.low > candle1.high) : (candle3.high < candle1.low);
    const level50 = (candle1.high + candle1.low) / 2;
    return { hasFVG, level50 };
  }

  checkLTFConfirmation(candles, level50, direction) {
    const current = candles[candles.length - 1];
    if (direction === "BULLISH" && current.low <= level50 && current.close > current.open) {
      return { entryTriggered: true, price: current.close };
    }
    if (direction === "BEARISH" && current.high >= level50 && current.close < current.open) {
      return { entryTriggered: true, price: current.close };
    }
    return { entryTriggered: false };
  }

  calculateRiskParameters({ direction, entryPrice, sweepInvalidationPrice, opposingLiquidityPrice }) {
    const pipMultiplier = 0.0001; // Standard FX/Crypto pip offset
    const buffer = this.spreadBufferPips * pipMultiplier;

    const stopLoss = direction === "BULLISH" 
      ? sweepInvalidationPrice - buffer 
      : sweepInvalidationPrice + buffer;

    const riskDistance = Math.abs(entryPrice - stopLoss);
    const riskAmountUSD = this.accountBalance * this.maxRiskPercent;
    const positionSizeLots = parseFloat((riskAmountUSD / (riskDistance * 100000)).toFixed(2));

    const rewardDistance = Math.abs(opposingLiquidityPrice - entryPrice);
    const riskRewardRatio = parseFloat((rewardDistance / riskDistance).toFixed(2));
    const tp1 = direction === "BULLISH" ? entryPrice + (riskDistance * 2.0) : entryPrice - (riskDistance * 2.0);

    return {
      entryPrice,
      stopLoss: parseFloat(stopLoss.toFixed(5)),
      tp1: parseFloat(tp1.toFixed(5)),
      tp2: parseFloat(opposingLiquidityPrice.toFixed(5)),
      positionSizeLots,
      riskAmountUSD: parseFloat(riskAmountUSD.toFixed(2)),
      riskRewardRatio
    };
  }
}

/**
 * 2. WEBSOCKET REAL-TIME DATA STREAMER
 */
class TerminalDataStreamer {
  constructor(symbol, timeframeMap, engineInstance, onSignalCallback) {
    this.symbol = symbol.toLowerCase();
    this.timeframeMap = timeframeMap; // e.g., { HTF: "1h", ITF: "15m", LTF: "1m" }
    this.engine = engineInstance;
    this.onSignalCallback = onSignalCallback;
    this.candles = { HTF: [], ITF: [], LTF: [] };
    this.ws = null;
  }

  connect() {
    const streams = Object.values(this.timeframeMap)
      .map(tf => `${this.symbol}@kline_${tf}`)
      .join('/');
    
    this.ws = new WebSocket(`wss://stream.binance.com:9443/stream?streams=${streams}`);

    this.ws.onopen = () => console.log(`[Terminal Core] Connected to feed for ${this.symbol.toUpperCase()}`);
    
    this.ws.onmessage = (event) => {
      const parsed = JSON.parse(event.data);
      if (parsed.data && parsed.data.e === 'kline') {
        this.processKline(parsed.data);
      }
    };

    this.ws.onclose = () => setTimeout(() => this.connect(), 3000);
  }

  processKline(klineData) {
    const k = klineData.k;
    const tier = Object.keys(this.timeframeMap).find(key => this.timeframeMap[key] === k.i);
    if (!tier) return;

    const candle = {
      openTime: k.t,
      open: parseFloat(k.o),
      high: parseFloat(k.h),
      low: parseFloat(k.l),
      close: parseFloat(k.c),
      isClosed: k.x
    };

    const buffer = this.candles[tier];
    if (buffer.length === 0) {
      buffer.push(candle);
    } else if (buffer[buffer.length - 1].openTime === candle.openTime) {
      buffer[buffer.length - 1] = candle;
    } else {
      buffer.push(candle);
      if (buffer.length > 50) buffer.shift();
    }

    const decision = this.engine.evaluateMultiTimeframe(this.candles, new Date());
    if (decision.status === 'EXECUTE_TRADE' && this.onSignalCallback) {
      this.onSignalCallback(decision);
    }
  }
}

/**
 * 3. TERMINAL INITIALIZATION & AUTO-EXECUTION DISPATCHER
 */
document.addEventListener('DOMContentLoaded', () => {
  // Initialize Engine with $20,000 Equity, 1% Risk, 2 Pips Spread Buffer
  const engine = new InstitutionalStrategyEngine(20000, 0.01, 2);

  const streamer = new TerminalDataStreamer(
    'btcusdt',
    { HTF: '1h', ITF: '15m', LTF: '1m' },
    engine,
    (signal) => {
      console.log('🚨 AUTOMATED TRADE SIGNAL TRIGGERED 🚨', signal);
      
      // Update UI Terminal Log if log element exists
      const outputElem = document.getElementById('terminal-output');
      if (outputElem) {
        outputElem.innerHTML += `\n[SIGNAL] ${signal.direction} | Entry: ${signal.entryPrice} | SL: ${signal.stopLoss} | Lots: ${signal.positionSizeLots}`;
      }
    }
  );

  streamer.connect();
});
</script>
